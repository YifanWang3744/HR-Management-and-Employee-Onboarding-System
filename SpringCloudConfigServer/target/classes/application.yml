server:
  port: 8889

spring:
  cloud:
    config:
      server:
        git:
#          uri: https://github:com/BFProjectTeam3/SpringCloudConfig.git
          uri: https://github.com/BFProjectTeam3/SpringCloudConfig.git
#          uri: https://github.com/Sharon-Ting/Spring-Cloud-Config-Server.git
          clone-on-start: true
          skip-ssl-validation: true
    bus:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
management:
  endpoint:
    busrefresh:
      enabled: true
  endpoints:
    web:
      exposure:
        include: bus-refresh
